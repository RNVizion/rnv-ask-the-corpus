name: Rebuild corpus on source edits

# Every six hours, and on demand: register newly published posts from the feed,
# detect edits to tracked pages, and when anything changed, commit the source list
# and hand off to ship-index.yml, which rebuilds, commits, gates, and deploys the
# index.
#
# GitHub cron is UTC, can lag under load, and GitHub disables a scheduled workflow
# after 60 days with no commit to the repo.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours; tighten or loosen as you like
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write
  actions: write

# Shares its group with rebuild-corpus.yml so the two corpus workflows fully
# serialize. cancel-in-progress stays false on BOTH.
concurrency:
  group: corpus-rebuild
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout corpus repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover new posts from the feed
        run: python scripts/discover.py

      - name: Check tracked sources for edits
        id: check
        run: python scripts/check_edits.py

      # Committed before the ship job starts, so that job, which checks out main
      # fresh, rebuilds from exactly this list. [skip ci] is belt and braces: a
      # GITHUB_TOKEN push starts nothing anyway.
      - name: Commit the source list and hashes
        if: steps.check.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json .source-hashes.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "corpus: refresh after source change (${SUMMARY}) [skip ci]"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

  ship:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/ship-index.yml
    secrets: inherit

  # Every pass, whether or not anything changed: ask the live demo one real
  # question. The deploy path already proves a deploy answers; this proves it
  # still answers six hours later, which is the thing nobody had between
  # 2026-08-21 and 2026-09-17, when an unpinned dependency took the Space down
  # and every instrument in the system stayed green. One model call per pass.
  #
  # Independent of the check job on purpose: a Space that stops answering is not
  # conditional on a post being edited.
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corpus repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Only the client, at the version requirements.txt pins for gradio.
      - name: Install the client
        run: |
          grep -E '^gradio==' requirements.txt > "$RUNNER_TEMP/health-requirements.txt"
          pip install -r "$RUNNER_TEMP/health-requirements.txt"

      - name: Ask the live demo one real question
        run: python scripts/deploy_space.py --check
