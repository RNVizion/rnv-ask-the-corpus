name: Rebuild corpus

# Rebuild, commit, gate, and deploy the index whenever the source list or the
# ingester changes on main, or on a manual run. The work lives in ship-index.yml.
#
# main only. This commits to main and ships to the live Space, so a branch push
# that touches the ingester (a chunking experiment, say) must not fire it; a branch
# commits its own rebuilt chroma/ and lets the pull_request eval judge it.
#
# The eval no longer triggers on these two paths itself. A push here always reached
# the eval before the rebuilt index did, so that run tested the old index and failed
# test_index_matches_manifest every time. The ship job dispatches the eval once the
# new index is committed.

on:
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "scripts/ingest.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shares its group with check-source-edits.yml so the two corpus workflows fully
# serialize. cancel-in-progress stays false on BOTH: neither an ingest nor an
# upload is a job you want killed halfway.
concurrency:
  group: corpus-rebuild
  cancel-in-progress: false

jobs:
  ship:
    uses: ./.github/workflows/ship-index.yml
    secrets: inherit
