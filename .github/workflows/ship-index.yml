name: ship index

# Rebuild the index from the live site, commit it, gate it, and deploy it. This is
# the one path by which chroma/ changes on main and on the Space.
#
# WHY IT COMMITS chroma/
# The corpus workflows used to rebuild the index and upload it to the Space without
# committing it, so the committed chroma/ fell behind sources.json after every
# discovery. The eval reads the committed index and test_index_matches_manifest
# fails on that drift, but a push made with GITHUB_TOKEN starts no workflow, so the
# drift sat unseen until the next human push on a trigger path, and that commit took
# the blame. It happened on 2026-08-21, and again on 2026-09-14 when a new post was
# reverted twice for drift it did not cause. Committing the index here keeps the
# repo, the Space, and the gate describing one corpus.
#
# WHY IT DISPATCHES THE EVAL
# The commit below is pushed with GITHUB_TOKEN, which deliberately starts nothing.
# workflow_dispatch is the documented exception, so the gate is started explicitly,
# once, against main with the new index on it.
#
# WHEN IT DOES NEITHER
# When main already holds an index with the same content, there is nothing to
# commit or gate. Until 2026-09-30 that case was decided by comparing bytes, and
# every rebuild writes fresh ids and timestamps, so it never fired: four of the
# first six committed rebuilds held the same text as the index they replaced, and
# each spent a full eval and a Space redeploy. scripts/compare_index.py decides it
# now, on what the index says.
#
# WHAT IS AND IS NOT GATED
# The index deploys without waiting for the eval, as it always has: a new post
# should reach the demo even while a case needs attention, and the eval's verdict is
# visible either way. app.py and requirements.txt do wait; they reach the Space only
# through deploy-app.yml, after the eval passes.
#
# Called by rebuild-corpus.yml and check-source-edits.yml, which share the
# corpus-rebuild concurrency group, so two ships never overlap. Do not give this
# file a concurrency group of its own.

on:
  workflow_call:
    secrets:
      CORPUS_CI:
        required: true

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the index
      actions: write    # dispatch the eval
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The contract on sources.json, before an index is built from it. Every
      # writer's change reaches the Space through this job: discovery's (already
      # checked before its commit, so this is a second look), the publishing
      # agent's push, and any hand edit. Until 2026-09-29 the contract first ran
      # inside the eval this job dispatches, after the index was already live.
      # Same pytest pin as eval.yml and check-source-edits.yml.
      - name: Gate the source-list contract
        run: |
          pip install pytest==9.1.1
          pytest tests/ -v

      # Wipes chroma/ and rebuilds it from the live URLs. Exits 1 if any declared
      # source did not land, so a partial index is never committed or shipped.
      - name: Rebuild the index from the live site
        run: python scripts/ingest.py

      - name: Index must match sources.json exactly
        run: python eval/check_index_coverage.py --strict

      # A generated artifact is replaced, never merged: set the index aside, move to
      # whatever main holds now, and write it over the top. If sources.json changed
      # on main while this ran, this index describes an older list, and the push
      # that changed it has queued its own rebuild; stand down rather than commit a
      # stale index over a newer declaration.
      #
      # If main's index already says the same thing, commit nothing. If the
      # comparison cannot say, warn and decide on bytes, which commits: a mistake
      # here costs one unneeded ship, never a skipped one. Equal content also means
      # equal chunk ids, so main's index passes the --strict check above as well.
      - name: Commit the index
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          built_from="$(git hash-object sources.json)"
          tmp="$(mktemp -d)"
          cp -r chroma "$tmp/chroma"

          for attempt in 1 2 3; do
            git fetch -q origin main
            if [ "$(git rev-parse origin/main:sources.json)" != "$built_from" ]; then
              echo "::notice::sources.json changed on main during this rebuild; the queued run will ship it"
              echo "committed=false" >> "$GITHUB_OUTPUT"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git reset -q --hard origin/main
            # reset restores main's tracked files but leaves the rebuild's segment
            # directory beside them, untracked; clear it so chroma/ is main's alone
            git clean -q -f -d -x -- chroma

            verdict=0
            python scripts/compare_index.py chroma "$tmp/chroma" || verdict=$?
            if [ "$verdict" -eq 0 ]; then
              echo "nothing to commit or gate"
              echo "committed=false" >> "$GITHUB_OUTPUT"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$verdict" -ne 1 ]; then
              echo "::warning::could not compare the rebuilt index with main's, so deciding on bytes; every rebuild will ship until this is fixed"
            fi

            rm -rf chroma
            cp -r "$tmp/chroma" chroma
            git add -A chroma
            if git diff --cached --quiet; then
              echo "index unchanged byte for byte; nothing to commit"
              echo "committed=false" >> "$GITHUB_OUTPUT"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -q -m "corpus: rebuild index [skip ci]"
            if git push -q origin HEAD:main; then
              echo "committed $(git rev-parse --short HEAD)"
              echo "committed=true" >> "$GITHUB_OUTPUT"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, main moved; retrying ($attempt/3)"
            sleep 3
          done
          echo "::error::could not commit the index after 3 attempts"
          exit 1

      - name: Gate the new index
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run eval.yml --ref main

      # Runs whether or not anything was committed, against main's index either
      # way. When the Space already holds it, deploy_space.py uploads nothing, says
      # "Space already matches", and nothing restarts. When an earlier deploy
      # failed, this is how the Space catches up: rerunning a failed ship used to
      # redeploy only because every rebuild looked changed.
      - name: Deploy the index and check the live app answers
        if: steps.commit.outputs.deploy == 'true'
        env:
          HF_TOKEN: ${{ secrets.CORPUS_CI }}
        run: python scripts/deploy_space.py --index --smoke
